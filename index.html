<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRN RWA — Carteira Digital</title>
    <style>
        :root { color-scheme: dark; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; font-size: 24px; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 20px; }
        .section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 250px; }
        label { display: block; font-size: 12px; color: #8b949e; text-transform: uppercase; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; background: #0d1117; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
        button { padding: 10px 20px; background: #238636; color: white; border: 0; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #2ea043; }
        .btn-secondary { background: #21262d; border: 1px solid #30363d; }
        .btn-secondary:hover { background: #30363d; border-color: #8b949e; }
        .balance-box { background: #1f6feb1a; border: 1px solid #1f6feb66; border-radius: 6px; padding: 15px; font-size: 16px; font-weight: bold; color: #58a6ff; line-height: 1.6; }
        .log-box { font-family: monospace; font-size: 12px; background: #0d1117; padding: 10px; border-radius: 6px; border: 1px solid #30363d; max-height: 120px; overflow-y: auto; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 BRN RWA — Carteira de Ativos do Mundo Real</h1>
        
        <!-- Chaves ECDSA -->
        <div class="section">
            <h3>🔑 Chaves Ativas (Endereçamento ECDSA)</h3>
            <div class="row">
                <div class="col">
                    <button onclick="generateWallet()">Criar Nova Carteira (ECDSA)</button>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Seu Endereço Público</label>
                    <input id="wallet-address" readonly placeholder="Gere ou carregue uma carteira...">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Sua Chave Privada (SK)</label>
                    <input id="wallet-sk" type="password" readonly>
                </div>
                <div class="col">
                    <label>Sua Chave Pública (PK)</label>
                    <input id="wallet-pk" readonly>
                </div>
            </div>
        </div>

        <!-- Portfólio RWA -->
        <div class="section">
            <h3>📊 Saldos e Portfólio RWA</h3>
            <div class="row">
                <div class="col">
                    <button class="btn-secondary" onclick="checkBalances()">🔄 Sincronizar Saldos com o Nó</button>
                    <button class="btn-secondary" onclick="requestFaucet()">🚰 Chamar Faucet (BRN)</button>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Tokens e Compliance Ativos</label>
                    <div id="balance-display" class="balance-box">Nenhuma chave ativa monitorada.</div>
                </div>
            </div>
        </div>

        <!-- Persistência segura -->
        <div class="section">
            <h3>💾 Armazenamento Criptografado (.wallet)</h3>
            <div class="row">
                <div class="col">
                    <label>Nome do Arquivo</label>
                    <input id="file-name" value="carteira_rwa">
                </div>
                <div class="col">
                    <label>Senha Master (Argon2id)</label>
                    <input id="file-pass" type="password" placeholder="Mínimo 12 caracteres">
                </div>
            </div>
            <div class="row">
                <button onclick="exportWallet()">Exportar Backup Seguro</button>
                <button class="btn-secondary" onclick="importWallet()">Importar da Pasta wallets/</button>
            </div>
        </div>

        <!-- Transferências de Ativos -->
        <div class="section">
            <h3>💸 Liquidação de Ativos / Transferência</h3>
            <div class="row">
                <div class="col">
                    <label>ID do Ativo (Ex: BRN, AAPL, GOLD)</label>
                    <input id="tx-asset" value="BRN">
                </div>
                <div class="col">
                    <label>Quantidade</label>
                    <input id="tx-amount" type="number" step="0.000001" placeholder="0.00">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Destinatário (Endereço brn1...)</label>
                    <input id="tx-to" placeholder="brn1...">
                </div>
            </div>
            <button onclick="sendTransaction()" style="background: #e1b12c; color: black; width: 100%;">Assinar e Transmitir para o Livro-Razão</button>
        </div>

        <!-- Console Terminal -->
        <div class="section">
            <label>Console Operacional do Nó</label>
            <div id="console-log" class="log-box">Pronto para inicialização.</div>
        </div>
    </div>

    <script>
        function log(msg) {
            const box = document.getElementById('console-log');
            box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function generateWallet() {
            log("Derivando chaves assimétricas SECP256k1...");
            const kp = await window.chrome.webview.hostObjects.api.generate_wallet();
            document.getElementById('wallet-address').value = kp.address;
            document.getElementById('wallet-sk').value = kp.spend_secret_key;
            document.getElementById('wallet-pk').value = kp.public_key;
            log("Nova identidade gerada no nó local!");
            checkBalances();
        }

        async function checkBalances() {
            const addr = document.getElementById('wallet-address').value;
            if (!addr) { log("Nenhum endereço ativo selecionado."); return; }
            log("Consultando carteira via API RPC...");
            const port = await window.chrome.webview.hostObjects.api.portfolio(addr);
            
            if(port.erro) {
                document.getElementById('balance-display').innerHTML = `Erro de rede no servidor do nó. Verifique se o explorer.py está ativo na porta 5000.`;
                return;
            }

            let html = "";
            let empty = true;
            for (let asset in port) {
                empty = false;
                const statusKyc = port[asset].compliance ? port[asset].compliance.status : 'Nenhum';
                html += `<div>🔹 <strong>${asset}:</strong> ${port[asset].amount} BRN <span style="font-size:11px; color:#8b949e;">(Disponível: ${port[asset].available} | KYC: ${statusKyc})</span></div>`;
            }
            if (empty) html = "<div>Saldo: 0.00 BRN (Nenhum token atrelado a este endereço ainda)</div>";
            document.getElementById('balance-display').innerHTML = html;
            log("Saldos sincronizados com o estado atual da rede.");
        }

        async function requestFaucet() {
            const addr = document.getElementById('wallet-address').value;
            if (!addr) { log("Selecione um endereço primeiro."); return; }
            log("Chamando faucet na API do servidor local...");
            const res = await window.chrome.webview.hostObjects.api.faucet(addr);
            log(res.msg);
            checkBalances();
        }

        async function exportWallet() {
            const file = document.getElementById('file-name').value;
            const pass = document.getElementById('file-pass').value;
            const addr = document.getElementById('wallet-address').value;
            const sk = document.getElementById('wallet-sk').value;
            const pk = document.getElementById('wallet-pk').value;

            if(!addr || pass.length < 12) { log("❌ Erro: A senha master exige no mínimo 12 caracteres."); return; }
            log("Executando KDF Argon2id e cifragem simétrica AES-256-GCM...");
            const res = await window.chrome.webview.hostObjects.api.save_wallet(file, pass, addr, sk, pk);
            log(res.message);
        }

        async function importWallet() {
            const file = document.getElementById('file-name').value;
            const pass = document.getElementById('file-pass').value;

            if(!pass) { log("Digite a senha master do arquivo."); return; }
            log("Descriptografando payload .wallet...");
            const res = await window.chrome.webview.hostObjects.api.load_wallet(file, pass);
            
            if(res.status === "sucesso") {
                document.getElementById('wallet-address').value = res.address;
                document.getElementById('wallet-sk').value = res.spend_secret_key;
                document.getElementById('wallet-pk').value = res.public_key;
                log("✅ Sucesso: Backup restaurado de forma íntegra!");
                checkBalances();
            } else {
                log("❌ Falha: " + res.message);
            }
        }

        async function sendTransaction() {
            const sender = document.getElementById('wallet-address').value;
            const to = document.getElementById('tx-to').value;
